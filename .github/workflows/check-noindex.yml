name: Keep report out of search
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  noindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate public package
        run: python validate_noindex.py
      - name: Guard every HTML route
        run: |
          python - <<'PY'
          import pathlib, re
          pages = list(pathlib.Path('.').rglob('*.html'))
          for page in pages:
              text = page.read_text(encoding='utf-8')
              assert re.search(r'<meta[^>]+name=[\"\x27]robots[\"\x27][^>]+content=[\"\x27][^\"\x27]*noindex', text, re.I), page
          print(f'Validated noindex on {len(pages)} HTML documents')
          PY
